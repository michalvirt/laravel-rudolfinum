<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Laravel Rudolfinum API (Swagger UI)</title>
        <link
            rel="stylesheet"
            href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
        />
        <style>
            body {
                margin: 0;
            }
        </style>
    </head>
    <body>
        <div id="swagger-ui"></div>

        <script
            src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"
            crossorigin
        ></script>
        <script>
            // The specification is fetched over HTTP, so serve this folder first:
            //   php -S localhost:8081 -t docs
            window.onload = () => {
                window.ui = SwaggerUIBundle({
                    url: 'openapi.yaml',
                    dom_id: '#swagger-ui',
                    deepLinking: true,
                    tryItOutEnabled: false,
                    persistAuthorization: true,
                });
            };
        </script>
    </body>
</html>
