# Production stack of small images: PHP-FPM, nginx, Inertia SSR, scheduler, queue, MariaDB.
#
#   cp compose.production.yaml docker-compose.yml
#   cp .env.production.example .env
#   php -r 'echo "APP_KEY=base64:".base64_encode(random_bytes(32)), PHP_EOL;'
#
#   docker compose --env-file .env.production -f compose.production.yaml up -d --build
#
# Recreate containers after a new build so migrations run again:
#   docker compose --env-file .env.production -f compose.production.yaml up -d --build --force-recreate

name: rudolfinum

x-php-build: &php-build
    context: .
    dockerfile: Dockerfile
    target: app
    args:
        VITE_APP_NAME: ${APP_NAME:-Laravel}

x-php-environment: &php-environment
    APP_ENV: production
    APP_DEBUG: '0'
    LOG_CHANNEL: stderr
    LOG_LEVEL: info
    DB_CONNECTION: mariadb
    DB_HOST: database
    DB_PORT: '3306'
    DB_DATABASE: ${DB_DATABASE:-rudolfinum}
    DB_USERNAME: ${DB_USERNAME:-rudolfinum}
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    INERTIA_SSR_ENABLED: '1'
    INERTIA_SSR_URL: http://ssr:13714
    INERTIA_SSR_ENSURE_BUNDLE_EXISTS: '0'

x-php: &php
    image: rudolfinum-app:production
    build: *php-build
    env_file:
        - path: .env.production
          required: true
    environment: *php-environment
    init: true

x-logging: &logging
    driver: json-file
    options:
        max-size: '10m'
        max-file: '3'

services:
    mailpit:
        image: axllent/mailpit:latest
        container_name: mailpit
        hostname: mailpit
        restart: unless-stopped
        ports:
            - '8025:8025'
    database:
        image: mariadb:11.8
        container_name: database
        hostname: database
        restart: unless-stopped
        environment:
            MARIADB_DATABASE: ${DB_DATABASE:-rudolfinum}
            MARIADB_USER: ${DB_USERNAME:-rudolfinum}
            MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        volumes:
            - database:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s
        logging: *logging

    migrate:
        <<: *php
        container_name: migrate
        hostname: migrate
        command: php artisan migrate --force --no-interaction --seed
        environment:
            <<: *php-environment
            RUN_OPTIMIZE: '0'
        depends_on:
            database:
                condition: service_healthy
        restart: 'no'

    app:
        <<: *php
        container_name: app
        hostname: app
        restart: unless-stopped
        depends_on: &app-depends-on
            database:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    'CMD',
                    'php',
                    '-r',
                    "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);",
                ]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 40s
        logging: *logging

    web:
        image: rudolfinum-web:production
        container_name: web
        hostname: web
        build:
            context: .
            dockerfile: Dockerfile
            target: web
            args:
                VITE_APP_NAME: ${APP_NAME:-Laravel}
        restart: unless-stopped
        init: true
        ports:
            - '${HTTP_PORT:-80}:80'
        depends_on:
            app:
                condition: service_healthy
        read_only: true
        tmpfs:
            - /var/cache/nginx
            - /var/run
            - /tmp
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/up']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        logging: *logging

    ssr:
        image: rudolfinum-ssr:production
        container_name: ssr
        hostname: ssr
        build:
            context: .
            dockerfile: Dockerfile
            target: ssr
            args:
                VITE_APP_NAME: ${APP_NAME:-Laravel}
        restart: unless-stopped
        init: true
        environment:
            NODE_ENV: production
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:13714/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s
        logging: *logging

    scheduler:
        <<: *php
        container_name: scheduler
        hostname: scheduler
        command: php artisan schedule:work --no-interaction
        restart: unless-stopped
        stop_grace_period: 30s
        depends_on: *app-depends-on
        logging: *logging

    queue:
        <<: *php
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --no-interaction
        restart: unless-stopped
        stop_grace_period: 30s
        depends_on: *app-depends-on
        logging: *logging

volumes:
    database:
